packages:
  - repo: SGP
    title: SGP
    summary: Student Growth Percentiles & Percentile Growth Projections/Trajectories.
    github:
      full_name: dbetebenner/SGP
      private: false
      pushed: '2026-10-16'
      description: >-
        Functions to calculate student growth percentiles and percentile growth projections/trajectories for students using large scale,
        longitudinal assessment data.  Functions use quantile regression to estimate the conditional density associated with each student's
        achievement history.  Percentile growth projections/trajectories are calculated using the coefficient matrices derived from the
        quantile regression analyses and specify what percentile growth is required for students to reach future achievement targets. 
        SystemRequirements: (PDF)LaTeX (http://www.latex-project.org/) with pdfpages package for studentGrowthPlot option in visualizeSGP to
        bind together student growth plots into school catalogs.
      repo_url: https://github.com/dbetebenner/SGP
      pages_url: https://dbetebenner.github.io/SGP/
