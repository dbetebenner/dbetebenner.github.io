# Curated catalog of existing dbetebenner/* GitHub repos that hold talks, sites, packages, or experiments.
# Human-maintained. tools/inventory/scan-repos.mjs enriches each entry from GitHub (visibility, Pages URL,
# last push) and checks that the deck URL resolves, writing catalog/generated/repos.yml.
#
# kind:        talk | site | package | experiment | exclude
# delivery:    link (deck lives in its own repo; the hub links to it — never moved: QR codes point there)
# theme:       deck theme lineage, used by the 2026 review (see review/2026-decks.md)
# source:      where the deck source lives when the repo holds only rendered output

series:
  liwld:
    title: Longitudinal Inference Without Longitudinal Data
    summary: A copula-based framework that recovers growth from cross-sectional assessment data, unifying TAMP and SGP.
  dtp-llp:
    title: Death to Proficiency! Long Live Proficiency!
    summary: The case for coherence in accountability system design.

